<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><style>
        .container{
            height: 100vh;
            border: 1px solid black;
        }
        .header,.footer{
            height: 20%;
            background-color: teal ;
        }
        .center{
            
            height: 60%;
            background-color: blanchedalmond;
            display: flex;
        }
        .left{
            height: 100%;
            width: 30%;
            background-color: blue;
        }
        .right{
            height: 100%;
            width: 70%;
            background-color:skyblue;
        }
        .top{
            height: 50%;
            background-color: bisque;
        }
        .down{
            height: 50%;
            background-color: yellow;
            display:flex
            
        }
       
        .b1{
            height: 100%;
            width: 50%;
            background: #6bcddf;
        }
        .b2{
            height: 100%;
             width: 50%;
            background: #a9f14b;
        }
    </style>
    
</head>
<body>
     <h1 align="center">Flex Box</h1>
    <div class="container">
        <div class="header"></div>
        <div class="center">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                    <div class="down">
                        <div class="b1"></div>
                    <div class="b2"></div>
                </div>
                    </div>
                    
        </div>    
        <div class="footer"></div></div>
    </div>    
</body>
</html>
